<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }
        .box {
            width: 300px;
            margin: 100px auto;
            background: white;
            padding: 20px;
            border: 1px solid #ccc;
        }
        input {
            width: 100%;
            padding: 8px;
            margin-top: 8px;
            margin-bottom: 12px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 8px;
        }
        p {
            color: red;
        }
        a {
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>Регистрация</h2>

        {% if message %}
            <p>{{ message }}</p>
        {% endif %}

        <form method="post">
            <input type="text" name="login" placeholder="Логин">
            <input type="email" name="email" placeholder="Email">
            <input type="password" name="password" placeholder="Пароль">
            <button type="submit">Зарегистрироваться</button>
        </form>

        <p style="color:black;">
            Уже есть аккаунт?
            <a href="{{ url_for('login') }}">Войти</a>
        </p>
    </div>
</body>
</html>
